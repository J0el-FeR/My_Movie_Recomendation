<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>

<body>

<nav class="side-navigation" aria-label="Main navigation">

    <a href="#heroSection" class="nav-link">Hero Section</a>
    <a href="#recommendations" class="nav-link">Recommendations</a>
    <a href="#mystery" class="nav-link">Mystery</a>
    <a href="#collection" class="nav-link">Collection</a>
    <a href="#footer" class="nav-link">End</a>

</nav>

<button
    class="mobile-menu-button"
    id="mobile-menu-button"
    type="button"
    aria-label="Open Navegation Menu"
    aria-controls="mobile-menu"
    >

    &times;

<span></span>
<span></span>
<span></span>

</button>

<dialog class="mobile-menu" id="mobile-menu">

    <button
        class="mobile-menu-close"
        id="mobile-menu-close"
        type="button"
        aria-label="Close Navegation Menu"
        >

        &times;
    </button>

    <nav aria-label="Mobile navigation">

        <a href="#heroSection" class="nav-link">Hero Section</a>
        <a href="#recommendations" class="nav-link">Recommendations</a>
        <a href="#mystery" class="nav-link">Mystery</a>
        <a href="#collection" class="nav-link">Collection</a>
        <a href="#footer" class="nav-link">End</a>

    </nav>

</dialog>

<main>

    <section class="hero" id="heroSection">

        <div class="hero-picture">
            <picture>
                <source media="(max-width: 768px)" srcset="Files/Picture-mobile.png">
                <img src="Files/Picture.png" alt="My Picture">
            </picture>
        </div>

        <div class="hero-text">
            <h1>My Name</h1>
            <p>And this is one of my Hobby`s</p>
            <h2>Movies!</h2>
        </div>

    </section>


    <section class="recommendations" id="recommendations">

        <h2>Movie Recommendations</h2>

        <div class="carousel">
            <div class="carousel-track" id="recommendations-track">

            </div>
        </div>

    </section>

    <section class="mystery" id="mystery">

        <h2>Mystery Recommendation</h2>

        <div class="curtains">
            <div class="curtain curtain-left"></div>
            <div class="curtain curtain-right"></div>
        </div>

        <button class="mystery-reveal" id="mystery-reveal" type="button">
            Surprise Me!
        </button>

        <div class="mystery-result" id="mystery-result">

        </div>

        <button class="mystery-another" id="mystery-another" type="button">
            Another One!
        </button>

    </section>

    <section class="collection" id="collection">

        <h2>My Watched Movies</h2>

        <div class="collection-search">
            <input
                    type="search"
                    id="movie-search"
                    placeholder="Find something you like"
                    aria-label="Search watched movies"
            >
        </div>

        <div class="movie-grid" id="movie-grid">
        </div>
        <p class="no-results" id="no-results" hidden>No movies found.</p>

    </section>

</main>

<dialog class="popup" id="popup">
    <button class="popup-close" type="button"></button>
    <div class="popup-box">
        <div class="popup-media">
            <img class="popup-img" alt="Movie Poster">
        </div>
        <div class="popup-body">
            <div class="popup-heading">
                <h2 class="popup-title" id="popup-title"></h2>
                <a class="popup-rating" target="_blank" rel="noopener noreferrer" title="Open on IMDb" hidden>
                    <img class="rating-icon" alt="IMDb">
                    <span class="rating-value"></span>
                </a>
            </div>
            <p class="popup-text"></p>
        </div>
    </div>
</dialog>

<footer id="footer">

    <p>I hope you enjoy the movie the same way I did</p>
    <h2>Thank you!!!</h2>

</footer>

</body>
</html>
